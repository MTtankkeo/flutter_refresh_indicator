name: flutter_refresh_indicator
description: This package provides a refresh indicator widget that is far more flexible and native-like than the default Flutter one, built on top of flutter_nested_scroll.
version: 1.5.0
publisher: ttankkeo112@gmail.com
repository: https://github.com/MTtankkeo/flutter_refresh_indicator
topics:
  - refresh
  - refresh-indicator
  - pull-to-refresh
  - swipe-to-refresh

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  cupertino_ui: ^1.0.0
  flutter_nested_scroll: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
